              verticalFlip: "off"
      responses:
        '200':
          description: Success

  # 10. Video Output
  /video/param:
    get:
      summary: Get Video Output Params
      tags: [Video Output]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoParam'
              example:
                hardwareOutput:
                  hdmi: "on"
                  3g-sdi: "off"
                  12g-sdi: "off"
                  usb: "on"
                  ip: "on"
                hardwareOutputResolution: "2160p60"
                stream1:
                  encode: "h264"
                  framerate: 60
                  bitrateControl: "cbr"
                  slice: "off"
                  width: 1920
                  height: 1080
                  gop: 180
                  bitrate: 3000
                  qFactor: 80
                  maxQ: 51
                  minQ: 1
                stream2:
                  encode: "h264"
                  framerate: 30
                  bitrateControl: "cbr"
                  width: 640
                  height: 360
                  gop: 30
                  bitrate: 2048
    post:
      summary: Set Video Output Params
      tags: [Video Output]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoParam'
            example:
              stream1:
                encode: "mjpeg"
                framerate: "60"
                profile: "MAIN"
                bitrateControl: "cbr"
                slice: "NO"
                sliceSize: "23"
                width: "1920"
                height: "1080"
                gop: "50"
                bitrate: "5555"
                minQ: "1"
              stream2:
                encode: "h265"
                framerate: "60"
                profile: "MAIN"
                bitrateControl: "cbr"
                slice: "NO"
                sliceSize: "23"
                width: "720"
                height: "480"
                gop: "60"
                bitrate: "6666"
                qFactor: "80"
                maxQ: "51"
                minQ: "1"
      responses:
        '200':
          description: Success

