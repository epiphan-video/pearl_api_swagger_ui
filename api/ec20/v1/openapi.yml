                $ref: '#/components/schemas/AiParam'
              example:
                enable: "off"
                mode: "tracking"
                debugMode: "debug"
                hintCue: "on"
                presenterTracking:
                  figureSize: "full"
                  customFigureSize: "80"
                  figurePosition: "middle"
                  startPosition: "current"
                zoneTracking:
                  startArea: "a"
    post:
      summary: Set AI Tracking Params
      tags: [AI Tracking]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiParam'
            example:
              enable: "on"
              debugMode: "off"
              hintCue: "off"
              mode: "tracking"
              presenterTracking:
                figureSize: "full"
                customFigureSize: "222"
                startPosition: "currentLocation"
                figurePosition: "left"
              zoneTracking:
                startArea: "A"
      responses:
        '200':
          description: Success

  /ai/presenter/select:
    post:
      summary: Select Presenter for Tracking
      tags: [AI Tracking]
      requestBody:
        content:
          application/json:
