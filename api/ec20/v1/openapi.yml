              action: "on"
              status: "off"
              tallyOption: "red"
      responses:
        '200':
          description: Success

  # 13. Streaming (RTMP/SRT/Multicast/ONVIF)
  /streaming/rtmp:
    get:
      summary: Get RTMP Settings
      tags: [Streaming]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RtmpSettings'
              example:
                stream1:
                  enable: "off"
                  err_msg: "Stream disabled"
                  key: ""
                  mrl: "rtmps://"
                stream2:
                  enable: "off"
                  active: "fail"
                  err_msg: "Stream disabled"
                  key: ""
                  mrl: "rtmps://"
    post:
      summary: Set RTMP Settings
      tags: [Streaming]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RtmpSettings'
            example:
              stream1:
                enable: "on"
                video_en: "on"
                audio_en: "on"
                mrl: "rtmps://example.com/live"
              stream2:
                enable: "off"
      responses:
        '200':
          description: Success

  /streaming/srt:
    get:
      summary: Get SRT Settings
      tags: [Streaming]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SrtSettings'
              example:
                mode: "listener"
                server: "192.168.100.1"
                port: 4578
                encryption: "none"
                password: "1234567890"
                bandwidth: 25
                latency: 500
                streamId: ""
    post:
      summary: Set SRT Settings
      tags: [Streaming]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SrtSettings'
            example:
              enable: "on"
              mode: "caller"
              server: "192.168.13.101"
              port: 4578
              encryption: "aes128"
              password: "1234567890"
              bandwidth: 50
              latency: 100
      responses:
        '200':
          description: Success

  /streaming/multicast:
    get:
      summary: Get Multicast Settings
      tags: [Streaming]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MulticastSettings'
              example:
                enable: "off"
                ip: "224.1.2.3"
                port: 6688
    post:
      summary: Set Multicast Settings
      tags: [Streaming]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MulticastSettings'
            example:
              enable: "on"
              ip: "224.1.2.3"
              port: 6688
      responses:
        '200':
          description: Success

  /streaming/onvif:
    get:
      summary: Get ONVIF Settings
      tags: [Streaming]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnvifSettings'
              example:
                enable: "off"
                auth: "off"
    post:
      summary: Set ONVIF Settings
      tags: [Streaming]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnvifSettings'
            example:
              enable: "on"
              auth: "on"
      responses:
        '200':
          description: Success
